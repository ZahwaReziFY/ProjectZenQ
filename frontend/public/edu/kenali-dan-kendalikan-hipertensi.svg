    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5626E"/><stop offset="1" stop-color="#B12F3D"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
